<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="120" height="120" role="img" aria-label="WhatsApp" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B2B2B"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
  </defs>
  <style>
    .ring { transform-box: fill-box; transform-origin: center; animation: pulse 2.6s ease-out infinite; }
    .r2 { animation-delay: 1.3s; }
    @keyframes pulse {
      0%   { transform: scale(1); opacity: 0.55; }
      100% { transform: scale(1.38); opacity: 0; }
    }
    .phone { transform-box: fill-box; transform-origin: center; animation: ringing 2.6s ease-in-out infinite; }
    @keyframes ringing {
      0%, 55%, 100% { transform: rotate(0deg); }
      6%  { transform: rotate(-14deg); }
      12% { transform: rotate(14deg); }
      18% { transform: rotate(-12deg); }
      24% { transform: rotate(12deg); }
      30% { transform: rotate(-8deg); }
      36% { transform: rotate(8deg); }
      42% { transform: rotate(0deg); }
    }
  </style>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="3" y="3" width="506" height="506" rx="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="4"/>
  <circle class="ring" cx="256" cy="244" r="140" fill="none" stroke="#FFFFFF" stroke-width="10"/>
  <circle class="ring r2" cx="256" cy="244" r="140" fill="none" stroke="#FFFFFF" stroke-width="10"/>
  <circle cx="256" cy="244" r="140" fill="none" stroke="#FFFFFF" stroke-width="26"/>
  <polygon points="146,352 112,436 214,388" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round"/>
  <g transform="translate(256,244) scale(6.4) translate(-12,-12)">
    <path class="phone" fill="#FFFFFF" d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
  </g>
</svg>
